name: Release Docker image archive

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.2 or v1.0.2"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-image-${{ github.ref_name }}-${{ inputs.version || 'tag' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, export and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          raw_version="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          version="${raw_version#v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like 1.0.2 or v1.0.2"
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "tar_name=ddt-insight-${version}-linux-amd64.tar" >> "${GITHUB_OUTPUT}"
          echo "asset_name=ddt-insight-${version}-linux-amd64.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          tags: |
            iskycc/ddt-insight:${{ steps.release.outputs.version }}
            iskycc/ddt-insight:latest
          outputs: type=docker,dest=${{ runner.temp }}/${{ steps.release.outputs.tar_name }}

      - name: Compress and checksum archive
        env:
          TAR_NAME: ${{ steps.release.outputs.tar_name }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          tar -tf "${RUNNER_TEMP}/${TAR_NAME}" | grep -q "manifest.json"
          gzip -9 "${RUNNER_TEMP}/${TAR_NAME}"

          cd "${RUNNER_TEMP}"
          sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## Offline Docker image archive"
            echo
            echo "- Image: iskycc/ddt-insight:${VERSION}"
            echo "- Platform: linux/amd64"
            echo "- Format: gzip-compressed Docker image archive"
            echo
            echo "Load the image without contacting a container registry:"
            echo
            echo '```bash'
            echo "gzip -dc ${ASSET_NAME} | docker load"
            echo '```'
          } > "${notes_file}"

          assets=(
            "${RUNNER_TEMP}/${ASSET_NAME}"
            "${RUNNER_TEMP}/${ASSET_NAME}.sha256"
          )

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "DDT Insight ${RELEASE_TAG}" \
              --notes-file "${notes_file}"
          fi
