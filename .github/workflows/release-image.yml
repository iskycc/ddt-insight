name: Release Docker image archives

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.3 or v1.0.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-image-${{ github.ref_name }}-${{ inputs.version || 'tag' }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Resolve release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          raw_version="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          version="${raw_version#v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like 1.0.3 or v1.0.3"
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## Offline Docker image archives"
            echo
            echo "Choose the archive that matches the target machine:"
            echo
            echo "| Platform | Archive |"
            echo "| --- | --- |"
            echo "| Linux x86-64 | \`ddt-insight-${VERSION}-linux-amd64.tar.gz\` |"
            echo "| Linux ARM64 / AArch64 | \`ddt-insight-${VERSION}-linux-arm64.tar.gz\` |"
            echo
            echo "Verify and load an archive without contacting a container registry:"
            echo
            echo '```bash'
            echo "sha256sum -c ddt-insight-${VERSION}-linux-<architecture>.tar.gz.sha256"
            echo "gzip -dc ddt-insight-${VERSION}-linux-<architecture>.tar.gz | docker load"
            echo '```'
            echo
            echo "Replace \`<architecture>\` with \`amd64\` or \`arm64\`."
          } > "${notes_file}"

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "DDT Insight ${RELEASE_TAG}" \
              --notes-file "${notes_file}"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "DDT Insight ${RELEASE_TAG}" \
              --notes-file "${notes_file}"
          fi

  build-and-release:
    name: Build and publish (${{ matrix.arch }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
          tags: |
            iskycc/ddt-insight:${{ needs.prepare-release.outputs.version }}
            iskycc/ddt-insight:latest
          outputs: type=docker,dest=${{ runner.temp }}/ddt-insight-${{ needs.prepare-release.outputs.version }}-linux-${{ matrix.arch }}.tar

      - name: Compress and checksum archive
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail

          tar_name="ddt-insight-${VERSION}-linux-${ARCH}.tar"
          asset_name="${tar_name}.gz"

          tar -tf "${RUNNER_TEMP}/${tar_name}" | grep -q "manifest.json"
          gzip -9 "${RUNNER_TEMP}/${tar_name}"

          cd "${RUNNER_TEMP}"
          sha256sum "${asset_name}" > "${asset_name}.sha256"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail

          asset_name="ddt-insight-${VERSION}-linux-${ARCH}.tar.gz"

          assets=(
            "${RUNNER_TEMP}/${asset_name}"
            "${RUNNER_TEMP}/${asset_name}.sha256"
          )

          gh release upload "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
